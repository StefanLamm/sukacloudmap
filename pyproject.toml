[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "suka-cloudmap"
version = "0.15.0"
description = "苏咔云图内部配送工作区"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2", "pwdlib[argon2]>=0.2,<1", "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.5,<3",
  "openpyxl>=3.1,<4", "defusedxml>=0.7,<1",
  "httpx>=0.27,<1", "scipy>=1.15,<2", "ortools>=9.14,<10",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

